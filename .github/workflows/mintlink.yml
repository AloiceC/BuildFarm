name: MintLink

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'BuildFarm task'
        required: true
        type: choice
        default: check
        options:
          - check
          - build-android
          - build-windows
          - deliver-android
          - deliver-windows
      source_sha:
        description: 'Optional exact 40-character commit SHA. Leave blank to use ci/buildfarm.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  buildfarm:
    uses: ./.github/workflows/private-flutter-rust-v1.yml
    with:
      project_id: mintlink
      task: ${{ inputs.task }}
      source_sha: ${{ inputs.source_sha }}
      github_app_client_id: ${{ vars.MINTLINK_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.MINTLINK_PRIVATE_KEY }}
