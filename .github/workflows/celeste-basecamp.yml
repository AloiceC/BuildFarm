name: Celeste Basecamp · Advanced

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'BuildFarm task'
        required: true
        type: choice
        default: check
        options:
          - check
          - build-windows
          - deliver-windows
      source_sha:
        description: 'Optional exact 40-character commit SHA. Leave blank to use ci/buildfarm.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  buildfarm:
    uses: ./.github/workflows/private-tauri-v1.yml
    with:
      project_id: celeste-basecamp
      task: ${{ inputs.task }}
      source_sha: ${{ inputs.source_sha }}
      auth_backend: fine-grained-pat
    secrets:
      repo_token: ${{ secrets.CELESTE_BASECAMP_TOKEN }}
